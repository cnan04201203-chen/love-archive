
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>婚纱纪念相册</title>
    <style>
        body {
            background-color: #fffaf5;
            font-family: "Helvetica Neue", sans-serif;
            margin: 40px;
        }
        h1 {
            text-align: center;
            color: #3f2f2f;
            margin-bottom: 40px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            padding: 30px;
            background: #fff;
            border: 6px double #d5b98c;
            border-radius: 12px;
        }
        .item {
            width: 40%;
            border: 2px solid #e5d9c8;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
            background-color: #fff;
        }
        .item img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }
        .caption {
            padding: 12px;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
            background-color: #fef9f4;
            color: #5b4a42;
        }
    </style>
</head>
<body>
    <h1>婚纱纪念相册</h1>
    <div class="gallery">
        <div class="item">
            <img src="../images/wedding_scene_1.png" alt="教堂婚礼">
            <div class="caption">并肩·在神的见证下</div>
        </div>
        <div class="item">
            <img src="../images/wedding_scene_3.png" alt="森林小礼服">
            <div class="caption">牵手·走过森林湖畔</div>
        </div>
        <div class="item">
            <img src="../images/wedding_scene_2.png" alt="日落海边亲吻">
            <div class="caption">亲吻·于日落之海</div>
        </div>
        <div class="item">
            <img src="../images/wedding_scene_4.png" alt="花房相拥">
            <div class="caption">相拥·在花开的房间里</div>
        </div>
        <div class="item">
            <img src="../images/group photo_1.png" alt="誓约·深情相拥">
            <div class="caption">誓约·深情相拥</div>
        <div class="item">
            <img src="../images/group photo_2.png" alt="相依·执手为盟">
            <div class="caption">相依·执手为盟</div>
        </div>
        <div class="item">
            <img src="../images/group photo_3.png" alt="共许·心动一生">
            <div class="caption">共许·心动一生</div>
        </div>
        <div class="item">
            <img src="../images/group photo_4.png" alt="印记·执笔写你">
            <div class="caption">印记·执笔写你</div>
        </div>
        <div class="item">
            <img src="../images/wedding_gufeng_1.png" alt="古风婚礼1">
            <div class="caption">结缘·烟火灯下</div>
        </div>
        <div class="item">
            <img src="../images/wedding_gufeng_2.png" alt="古风婚礼2">
            <div class="caption">缔结·只羡狸与君</div>
        </div>
    </div>
</body>
</html>
